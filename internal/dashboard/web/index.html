<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>baton</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6fdd">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fdd'/%3E%3Cpath d='M9 13h11l-4-4M23 19H12l4 4' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="/static/theme.js"></script>
</head>
<body>
<main>
  <header>
    <h1><a id="home" href="/" title="All projects">baton</a></h1>
    <button id="reload" class="ib ghost" title="Reload" aria-label="Reload"></button>
    <button id="theme" class="ib ghost"></button>
    <button id="logout" class="ib ghost" title="Sign out" aria-label="Sign out" hidden></button>
  </header>
  <div id="error" class="error" hidden></div>
  <div class="layout">
    <nav id="side" aria-label="Projects">
      <input id="q" type="search" placeholder="Search  /" aria-label="Search tasks, handoff text and tips" autocomplete="off">
      <div id="nav"></div>
      <select id="navsel" aria-label="Project"></select>
    </nav>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
  <footer>
    <span><span class="ver" id="ver"></span> · <span class="mono" id="root"></span></span>
    <span><a href="https://github.com/v-kravchenko/baton">GitHub</a> · <a href="https://github.com/v-kravchenko/baton/releases">Releases</a></span>
  </footer>
</main>
<div id="scrim" hidden></div>
<aside id="panel" hidden role="dialog" aria-modal="true" aria-label="Details">
  <div class="pbar"><span id="pwhere"></span><button id="pclose" class="ib ghost" title="Close (Esc)" aria-label="Close"></button></div>
  <div id="pbody"></div>
</aside>
<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
