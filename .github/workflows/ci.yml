name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: node --check embedded JS
        run: find internal/dashboard/web -name '*.js' -print0 | xargs -0 -r -n1 node --check

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - darwin/arm64
          - darwin/amd64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOARM: "7"
          TARGET: ${{ matrix.target }}
        run: |
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -trimpath -ldflags="-s -w" -o /tmp/baton ./cmd/baton
